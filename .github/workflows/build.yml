name: MIDCORE Custom Build

on:
  workflow_dispatch: # <-- 이 줄이 있어야 'Run workflow' 버튼이 생깁니다!
  push:
    branches:
      - master # 또는 기영님이 쓰시는 브랜치명 (main 등)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle (Offline)
        # JitPack 에러를 피하기 위해 --offline 모드로 실행합니다.
        run: ./gradlew shadowJar -x test --no-daemon --offline

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-MIDCORE-Jar
          path: build/libs/oraxen-*-MIDCORE.jar
