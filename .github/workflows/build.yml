name: MIDCORE Custom Build

on:
  workflow_dispatch: # 수동 실행 버튼 활성화
  push:
    # 브랜치 제한을 풀어서 어떤 상황에서도 빌드가 돌게 합니다.
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # 서브모듈이 있다면 함께 불러옵니다.

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build with Gradle (Offline)
        # --offline을 빼고 먼저 시도해보고, 안 되면 다시 넣어서 조절해 드릴게요.
        run: ./gradlew shadowJar -x test --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oraxen-MIDCORE-Jar
          # 빌드된 결과물 경로가 맞는지 확인하는 단계
          path: "**/build/libs/oraxen-*-MIDCORE.jar"
